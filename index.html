<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncParty - Video Watch Party</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Custom Scrollbar for a premium look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        
        /* Video Player enhancements */
        video {
            outline: none;
            border-radius: 0.5rem;
            background-color: #000;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(75, 85, 99, 0.4);
        }

        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-900/20 blur-[120px]"></div>
        <div class="absolute top-[60%] -right-[10%] w-[50%] h-[50%] rounded-full bg-indigo-900/20 blur-[120px]"></div>
    </div>

    <!-- LOGIN / ENTRY VIEW -->
    <div id="login-view" class="w-full max-w-md p-8 glass-panel rounded-2xl shadow-2xl z-10 transition-all duration-500">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2 flex justify-center items-center gap-3">
                <i class="fa-solid fa-clapperboard text-blue-500"></i> SyncParty
            </h1>
            <p class="text-gray-400 text-sm">Watch videos in sync with your friends.</p>
        </div>

        <div class="space-y-6">
            <!-- Role Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">I am joining as a:</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="host" class="peer sr-only" checked>
                        <div class="text-center p-3 rounded-lg border border-gray-700 bg-gray-800 peer-checked:bg-blue-600 peer-checked:border-blue-500 hover:bg-gray-700 transition-colors">
                            <i class="fa-solid fa-crown mb-1"></i> Host
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="member" class="peer sr-only">
                        <div class="text-center p-3 rounded-lg border border-gray-700 bg-gray-800 peer-checked:bg-indigo-600 peer-checked:border-indigo-500 hover:bg-gray-700 transition-colors">
                            <i class="fa-solid fa-user mb-1"></i> Member
                        </div>
                    </label>
                </div>
            </div>

            <!-- Room ID -->
            <div>
                <label for="room-id" class="block text-sm font-medium text-gray-300 mb-1">Room ID</label>
                <input type="text" id="room-id" placeholder="e.g., MovieNight" class="w-full px-4 py-3 rounded-lg bg-gray-900 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-gray-500 transition-colors outline-none" required>
            </div>

            <!-- Password -->
            <div>
                <label for="room-password" class="block text-sm font-medium text-gray-300 mb-1">Room Password</label>
                <input type="password" id="room-password" placeholder="Enter password" class="w-full px-4 py-3 rounded-lg bg-gray-900 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-gray-500 transition-colors outline-none" required>
            </div>

            <!-- Error Message -->
            <div id="login-error" class="hidden text-red-400 text-sm text-center bg-red-900/20 p-2 rounded border border-red-900/50"></div>

            <!-- Action Button -->
            <button id="join-btn" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-lg shadow-lg transform transition hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-900 flex justify-center items-center gap-2">
                <span>Enter Room</span>
                <div id="join-spinner" class="hidden w-4 h-4 border-2 border-white border-solid rounded-full loader"></div>
            </button>
        </div>
    </div>

    <!-- ROOM / PLAYER VIEW -->
    <div id="room-view" class="hidden w-full h-screen max-w-7xl mx-auto p-4 md:p-6 flex flex-col z-10 transition-all duration-500">
        
        <!-- Room Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 glass-panel p-4 rounded-xl">
            <div>
                <h2 class="text-2xl font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-satellite-dish text-green-400 animate-pulse text-sm"></i>
                    Room: <span id="display-room-id" class="text-blue-400"></span>
                </h2>
                <p class="text-gray-400 text-sm mt-1">Logged in as: <span id="display-role" class="font-semibold text-white capitalize"></span></p>
            </div>
            <button id="leave-btn" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Leave Room
            </button>
        </div>

        <!-- Host Controls Panel (Hidden for Members) -->
        <div id="host-controls" class="hidden mb-6 glass-panel p-5 rounded-xl border-l-4 border-l-blue-500">
            <h3 class="text-lg font-semibold mb-3 flex items-center gap-2 text-blue-400">
                <i class="fa-solid fa-sliders"></i> Host Controls
            </h3>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="video-url-input" placeholder="Paste public video URL (MP4, WebM, etc.)" class="flex-1 px-4 py-2 rounded-lg bg-gray-900 border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white outline-none">
                <button id="set-video-btn" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors shadow-lg whitespace-nowrap">
                    <i class="fa-solid fa-link"></i> Set Video
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-circle-info"></i> Make sure the URL points directly to a playable video file, accessible publicly.</p>
        </div>

        <!-- Video Player Container -->
        <div class="flex-1 flex flex-col relative rounded-xl overflow-hidden glass-panel border border-gray-700/50 shadow-2xl bg-black">
            
            <!-- Idle / No Video overlay -->
            <div id="no-video-overlay" class="absolute inset-0 flex flex-col items-center justify-center z-10 bg-gray-900/90 backdrop-blur-sm">
                <i class="fa-solid fa-film text-6xl text-gray-600 mb-4"></i>
                <p class="text-gray-400 text-lg">Waiting for host to set a video...</p>
            </div>

            <!-- The actual video element -->
            <!-- We use preload="auto" to start buffering in browser immediately when source is set -->
            <video id="sync-video" class="w-full h-full object-contain" controls preload="auto" playsinline>
                Your browser does not support HTML5 video.
            </video>
        </div>
        
        <!-- Status Bar -->
        <div class="mt-4 flex justify-between items-center text-xs text-gray-500 px-2">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></div>
                <span>Sync Active</span>
            </div>
            <div id="last-sync-time">Synchronized</div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION (Exact config provided) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCqJ9pqMpjME0NgTe_PnKwigD-oKT1Lzh8",
            authDomain: "tictactoe-office.firebaseapp.com",
            databaseURL: "https://tictactoe-office-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tictactoe-office"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- GLOBAL STATE ---
        let currentRole = null;
        let currentRoomId = null;
        let roomRef = null;
        
        // Sync control flags to prevent infinite loops (DOM event <-> Firebase update)
        let ignorePlayEvent = false;
        let ignorePauseEvent = false;
        let ignoreSeekEvent = false;

        // DOM Elements - Login
        const loginView = document.getElementById('login-view');
        const roomView = document.getElementById('room-view');
        const roomIdInput = document.getElementById('room-id');
        const roomPasswordInput = document.getElementById('room-password');
        const joinBtn = document.getElementById('join-btn');
        const joinSpinner = document.getElementById('join-spinner');
        const loginError = document.getElementById('login-error');
        
        // DOM Elements - Room
        const displayRoomId = document.getElementById('display-room-id');
        const displayRole = document.getElementById('display-role');
        const leaveBtn = document.getElementById('leave-btn');
        const hostControls = document.getElementById('host-controls');
        const videoUrlInput = document.getElementById('video-url-input');
        const setVideoBtn = document.getElementById('set-video-btn');
        
        // DOM Elements - Player
        const videoPlayer = document.getElementById('sync-video');
        const noVideoOverlay = document.getElementById('no-video-overlay');

        // --- LOGIN & ROOM JOINING LOGIC ---
        
        function showError(msg) {
            loginError.textContent = msg;
            loginError.classList.remove('hidden');
            setTimeout(() => loginError.classList.add('hidden'), 5000);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                joinSpinner.classList.remove('hidden');
                joinBtn.disabled = true;
                joinBtn.classList.add('opacity-75');
            } else {
                joinSpinner.classList.add('hidden');
                joinBtn.disabled = false;
                joinBtn.classList.remove('opacity-75');
            }
        }

        joinBtn.addEventListener('click', async () => {
            const roomId = roomIdInput.value.trim();
            const password = roomPasswordInput.value;
            const role = document.querySelector('input[name="role"]:checked').value;

            if (!roomId || !password) {
                showError("Please enter both Room ID and Password.");
                return;
            }

            setLoading(true);
            const ref = db.ref(`rooms/${roomId}`);

            try {
                const snapshot = await ref.once('value');
                const roomData = snapshot.val();

                if (role === 'host') {
                    if (roomData) {
                        // Room exists, verify password
                        if (roomData.password === password) {
                            enterRoom(roomId, role);
                        } else {
                            showError("Incorrect password for existing room.");
                        }
                    } else {
                        // Create new room
                        await ref.set({
                            password: password,
                            url: '',
                            isPlaying: false,
                            time: 0,
                            lastUpdated: firebase.database.ServerValue.TIMESTAMP
                        });
                        enterRoom(roomId, role);
                    }
                } else if (role === 'member') {
                    if (roomData) {
                        if (roomData.password === password) {
                            enterRoom(roomId, role);
                        } else {
                            showError("Incorrect password.");
                        }
                    } else {
                        showError("Room does not exist. Ask the host to create it.");
                    }
                }
            } catch (err) {
                console.error("Firebase Error:", err);
                showError("Database error. Please check configuration.");
            }
            
            setLoading(false);
        });

        // --- ENTERING ROOM ---
        function enterRoom(roomId, role) {
            currentRoomId = roomId;
            currentRole = role;
            roomRef = db.ref(`rooms/${roomId}`);

            // Update UI
            loginView.classList.add('hidden');
            roomView.classList.remove('hidden');
            displayRoomId.textContent = roomId;
            displayRole.textContent = role;

            if (role === 'host') {
                hostControls.classList.remove('hidden');
            } else {
                hostControls.classList.add('hidden');
            }

            // Start listening to Firebase changes for this room
            setupFirebaseListeners();
        }

        // Leave Room
        leaveBtn.addEventListener('click', () => {
            if (roomRef) {
                roomRef.off(); // Detach listeners
            }
            videoPlayer.pause();
            videoPlayer.src = "";
            
            currentRoomId = null;
            currentRole = null;
            roomRef = null;
            
            // Reset UI
            roomView.classList.add('hidden');
            loginView.classList.remove('hidden');
            noVideoOverlay.classList.remove('hidden');
            roomIdInput.value = '';
            roomPasswordInput.value = '';
        });


        // --- HOST CONTROLS ---
        setVideoBtn.addEventListener('click', () => {
            if (currentRole !== 'host') return;
            
            const newUrl = videoUrlInput.value.trim();
            if (newUrl) {
                // Update Firebase with new URL and reset playback state
                roomRef.update({
                    url: newUrl,
                    isPlaying: false,
                    time: 0,
                    lastUpdated: firebase.database.ServerValue.TIMESTAMP
                });
                videoUrlInput.value = ''; // clear input
            }
        });


        // --- FIREBASE SYNC LOGIC (RECEIVING) ---
        function setupFirebaseListeners() {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. Sync Video URL
                if (data.url) {
                    noVideoOverlay.classList.add('hidden');
                    if (videoPlayer.src !== data.url) {
                        videoPlayer.src = data.url;
                        // On new source, video load triggers, keep it paused initially as per DB state
                    }
                } else {
                    noVideoOverlay.classList.remove('hidden');
                }

                if (!data.url) return; // Wait until a URL is set to sync time/playback

                // 2. Sync Time (Seek)
                // Use a small tolerance (1.5 seconds) to avoid jittering from minor async delays
                if (Math.abs(videoPlayer.currentTime - data.time) > 1.5) {
                    // Set flag so our local DOM seeked listener doesn't immediately send a DB update back
                    ignoreSeekEvent = true; 
                    videoPlayer.currentTime = data.time;
                }

                // 3. Sync Playback State
                if (data.isPlaying && videoPlayer.paused) {
                    ignorePlayEvent = true;
                    videoPlayer.play().catch(e => {
                        console.error("Autoplay blocked by browser. User interaction needed.", e);
                        ignorePlayEvent = false; // Reset if failed
                    });
                } else if (!data.isPlaying && !videoPlayer.paused) {
                    ignorePauseEvent = true;
                    videoPlayer.pause();
                }
            });
        }


        // --- VIDEO DOM EVENT LOGIC (SENDING) ---
        
        // Helper to push state to Firebase
        function updateRoomState(updates) {
            if (!roomRef) return;
            updates.lastUpdated = firebase.database.ServerValue.TIMESTAMP;
            roomRef.update(updates);
        }

        // Listen for Play Event
        videoPlayer.addEventListener('play', () => {
            if (ignorePlayEvent) {
                // This play was triggered programmatically by Firebase, ignore it.
                ignorePlayEvent = false;
                return;
            }
            // User initiated play, notify everyone
            updateRoomState({
                isPlaying: true,
                time: videoPlayer.currentTime
            });
        });

        // Listen for Pause Event
        videoPlayer.addEventListener('pause', () => {
            if (ignorePauseEvent) {
                // This pause was triggered programmatically by Firebase, ignore it.
                ignorePauseEvent = false;
                return;
            }
            // User initiated pause (or video ended), notify everyone
            updateRoomState({
                isPlaying: false,
                time: videoPlayer.currentTime
            });
        });

        // Listen for Seek Event
        // 'seeked' fires when the user finishes scrubbing/jumping.
        videoPlayer.addEventListener('seeked', () => {
            if (ignoreSeekEvent) {
                // This seek was triggered programmatically by Firebase, ignore it.
                ignoreSeekEvent = false;
                return;
            }
            // User scrubbed the timeline, notify everyone
            updateRoomState({
                time: videoPlayer.currentTime
            });
        });
        
        // Handle window unload/disconnection gracefully if needed
        window.addEventListener('beforeunload', () => {
            if (roomRef) {
                roomRef.off();
            }
        });

    </script>
</body>
</html>
