<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncParty - Watch Together</title>
    
    <!-- Tailwind CSS (CDN for single-file deployment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs (v8 compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Netflix-style dark theme scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e50914;
        }
        
        body {
            background-color: #141414; /* Netflix dark gray/black */
            color: #e5e5e5;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Spinner Animation */
        .loader {
            border-top-color: #e50914;
            -webkit-animation: spinner 1s linear infinite;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Video specific styles to ensure it fills but maintains aspect ratio */
        video {
            background-color: #000;
            outline: none;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-red-900/10 blur-[150px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-red-900/10 blur-[150px]"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <div id="login-view" class="w-full max-w-md p-8 glass-panel rounded-2xl shadow-2xl z-10 transition-all duration-500 border-t-4 border-t-red-600">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-white mb-2 flex justify-center items-center gap-3 tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-red-600" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.75 3h18.5c.966 0 1.75.784 1.75 1.75v14.5A1.75 1.75 0 0 1 21.25 21H2.75A1.75 1.75 0 0 1 1 19.25V4.75C1 3.784 1.784 3 2.75 3zm18.5 1.5H2.75a.25.25 0 0 0-.25.25v14.5c0 .138.112.25.25.25h18.5a.25.25 0 0 0 .25-.25V4.75a.25.25 0 0 0-.25-.25zM10.25 8.5l6.5 3.5-6.5 3.5v-7z"/>
                </svg>
                SYNC<span class="text-red-600">PARTY</span>
            </h1>
            <p class="text-gray-400 text-sm">Synchronized cinematic experience.</p>
        </div>

        <div class="space-y-6">
            <!-- Role Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-3">Select your role:</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="host" class="peer sr-only" checked>
                        <div class="text-center p-4 rounded-xl border border-gray-700 bg-gray-900 peer-checked:bg-red-900/30 peer-checked:border-red-600 peer-checked:text-red-500 hover:bg-gray-800 transition-all flex flex-col items-center justify-center group">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 mb-2 text-gray-400 group-hover:text-red-500 peer-checked:text-red-500 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 20h20M4 16l-2-12 5 4 5-8 5 8 5-4-2 12z"/>
                            </svg>
                            <span class="font-semibold">Host</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="member" class="peer sr-only">
                        <div class="text-center p-4 rounded-xl border border-gray-700 bg-gray-900 peer-checked:bg-gray-800 peer-checked:border-white peer-checked:text-white hover:bg-gray-800 transition-all flex flex-col items-center justify-center group">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 mb-2 text-gray-400 group-hover:text-white peer-checked:text-white transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                            <span class="font-semibold">Member</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Room Credentials -->
            <div class="space-y-4">
                <div>
                    <label for="room-id" class="block text-sm font-medium text-gray-400 mb-1">Room ID</label>
                    <input type="text" id="room-id" placeholder="e.g., movie-night-123" class="w-full px-4 py-3 rounded-lg bg-gray-900 border border-gray-700 focus:border-red-600 focus:ring-1 focus:ring-red-600 text-white placeholder-gray-600 transition-colors outline-none">
                </div>
                <div>
                    <label for="room-password" class="block text-sm font-medium text-gray-400 mb-1">Room Password</label>
                    <input type="password" id="room-password" placeholder="Enter secure password" class="w-full px-4 py-3 rounded-lg bg-gray-900 border border-gray-700 focus:border-red-600 focus:ring-1 focus:ring-red-600 text-white placeholder-gray-600 transition-colors outline-none">
                </div>
            </div>

            <!-- Action Button -->
            <button id="join-btn" class="w-full py-4 px-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-lg transform transition active:scale-[0.98] focus:outline-none flex justify-center items-center gap-2">
                <span>Enter Room</span>
                <div id="join-spinner" class="hidden w-5 h-5 border-2 border-white border-solid rounded-full loader"></div>
            </button>
        </div>
    </div>

    <div id="room-view" class="hidden w-full h-screen mx-auto flex flex-col z-10 transition-all duration-500 bg-[#141414]">
        
        <!-- Navbar -->
        <header class="flex justify-between items-center px-6 py-4 bg-gradient-to-b from-black/80 to-transparent">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-black text-white flex items-center gap-2 tracking-wide">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-red-600" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.75 3h18.5c.966 0 1.75.784 1.75 1.75v14.5A1.75 1.75 0 0 1 21.25 21H2.75A1.75 1.75 0 0 1 1 19.25V4.75C1 3.784 1.784 3 2.75 3zm18.5 1.5H2.75a.25.25 0 0 0-.25.25v14.5c0 .138.112.25.25.25h18.5a.25.25 0 0 0 .25-.25V4.75a.25.25 0 0 0-.25-.25zM10.25 8.5l6.5 3.5-6.5 3.5v-7z"/>
                    </svg>
                    SYNC<span class="text-red-600">PARTY</span>
                </h2>
                <div class="h-6 w-px bg-gray-700"></div>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                    <span id="display-room-id" class="font-mono text-sm text-gray-300"></span>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <span id="display-role" class="text-xs font-bold uppercase px-2 py-1 bg-gray-800 rounded border border-gray-700"></span>
                <button id="leave-btn" class="px-4 py-2 hover:bg-gray-800 text-gray-300 hover:text-white rounded-lg transition-colors flex items-center gap-2 text-sm font-medium">
                    Exit
                </button>
            </div>
        </header>

        <div class="flex-1 flex flex-col px-4 md:px-8 pb-8 max-w-screen-2xl mx-auto w-full gap-4">
            
            <!-- Host Controls (Hidden for Members) -->
            <div id="host-controls" class="hidden glass-panel p-4 rounded-xl border border-gray-800 shrink-0">
                <div class="flex flex-col sm:flex-row gap-3 items-end">
                    <div class="flex-1 w-full">
                        <label for="video-url-input" class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Set Video Source</label>
                        <input type="text" id="video-url-input" placeholder="Paste Direct Link, Supabase URL, or Google Drive Link" class="w-full px-4 py-3 rounded-lg bg-black border border-gray-700 focus:border-red-600 focus:ring-1 focus:ring-red-600 text-white outline-none font-mono text-sm">
                    </div>
                    <button id="set-video-btn" class="w-full sm:w-auto px-8 py-3 bg-white hover:bg-gray-200 text-black font-bold rounded-lg transition-colors shadow-lg whitespace-nowrap flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                        Load Media
                    </button>
                </div>
            </div>

            <!-- Video Player Area -->
            <div class="flex-1 relative rounded-xl overflow-hidden bg-black shadow-2xl border border-gray-800 group flex items-center justify-center">
                
                <!-- Idle State Overlay -->
                <div id="no-video-overlay" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-[#141414]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-gray-700 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    <p class="text-gray-500 text-lg font-medium" id="idle-text">Awaiting Host to load media...</p>
                </div>

                <!-- Download Progress Overlay -->
                <div id="download-overlay" class="absolute inset-0 flex flex-col items-center justify-center z-30 bg-black/90 backdrop-blur-md hidden">
                    <div class="w-64 max-w-full p-6 glass-panel rounded-xl text-center border border-gray-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-red-600 mx-auto mb-4 animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <h3 class="text-white font-bold mb-2">Downloading Media</h3>
                        <div class="w-full bg-gray-800 rounded-full h-2 mb-2 overflow-hidden">
                            <div id="download-progress-bar" class="bg-red-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p id="download-text" class="text-xs text-gray-400 font-mono">0% (Initializing...)</p>
                        <p class="text-[10px] text-gray-600 mt-4 leading-tight">If download fails (e.g. CORS), it will automatically fallback to direct streaming.</p>
                    </div>
                </div>

                <!-- Actual Video Element -->
                <video id="sync-video" class="w-full h-full object-contain" controls preload="auto" playsinline>
                    Your browser does not support HTML5 video.
                </video>
            </div>
        </div>
    </div>

    <script>
        // --- LOGGING UTILITY ---
        function appLog(context, message, data = null) {
            const timestamp = new Date().toISOString().split('T')[1].slice(0,-1);
            const formattedMessage = `[${timestamp}] [${context}] ${message}`;
            if (data) {
                console.log(formattedMessage, data);
            } else {
                console.log(formattedMessage);
            }
        }

        // --- UI UTILITY ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800 border-gray-700 text-white';
            let icon = `<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            if (type === 'error') {
                bgClass = 'bg-red-950 border-red-900 text-red-100';
                icon = `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else if (type === 'success') {
                bgClass = 'bg-green-950 border-green-900 text-green-100';
                icon = `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border shadow-xl transform transition-all duration-300 translate-x-full opacity-0 ${bgClass}`;
            toast.innerHTML = `${icon} <span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            }, 10);

            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        // --- FIREBASE CONFIGURATION ---
        appLog('Init', 'Setting up Firebase...');
        const firebaseConfig = {
            apiKey: "AIzaSyCqJ9pqMpjME0NgTe_PnKwigD-oKT1Lzh8",
            authDomain: "tictactoe-office.firebaseapp.com",
            databaseURL: "https://tictactoe-office-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tictactoe-office"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            appLog('Init', 'Firebase initialized.');
        }
        const db = firebase.database();

        // --- STREAMING_CHUNK:Global State Variables ---
        let currentRole = null;
        let currentRoomId = null;
        let roomRef = null;
        let currentObjectUrl = null; // Store Blob URL to revoke memory later
        let currentVideoSource = null; // Store the original raw URL
        
        // Anti-Infinite Loop Flags (Strict Sync Engine)
        let isRemoteUpdatingPlay = false;
        let isRemoteUpdatingPause = false;
        let isRemoteUpdatingSeek = false;

        // DOM Elements
        const views = {
            login: document.getElementById('login-view'),
            room: document.getElementById('room-view')
        };
        const inputs = {
            roomId: document.getElementById('room-id'),
            roomPass: document.getElementById('room-password'),
            videoUrl: document.getElementById('video-url-input')
        };
        const btns = {
            join: document.getElementById('join-btn'),
            leave: document.getElementById('leave-btn'),
            setVideo: document.getElementById('set-video-btn')
        };
        const display = {
            roomId: document.getElementById('display-room-id'),
            role: document.getElementById('display-role'),
            hostControls: document.getElementById('host-controls')
        };
        const player = {
            video: document.getElementById('sync-video'),
            noVideoOver: document.getElementById('no-video-overlay'),
            dlOver: document.getElementById('download-overlay'),
            dlBar: document.getElementById('download-progress-bar'),
            dlText: document.getElementById('download-text'),
            idleText: document.getElementById('idle-text')
        };

        // --- STREAMING_CHUNK:Auth & Room Logic ---

        function setJoinLoading(isLoading) {
            const spinner = document.getElementById('join-spinner');
            if (isLoading) {
                spinner.classList.remove('hidden');
                btns.join.disabled = true;
                btns.join.classList.add('opacity-75');
            } else {
                spinner.classList.add('hidden');
                btns.join.disabled = false;
                btns.join.classList.remove('opacity-75');
            }
        }

        btns.join.addEventListener('click', async () => {
            const roomId = inputs.roomId.value.trim();
            const password = inputs.roomPass.value;
            const role = document.querySelector('input[name="role"]:checked').value;

            appLog('Auth', `Attempting to join room: ${roomId} as ${role}`);

            if (!roomId || !password) {
                showToast("Room ID and Password are required.", "error");
                return;
            }

            setJoinLoading(true);
            const ref = db.ref(`rooms/${roomId}`);

            try {
                const snapshot = await ref.once('value');
                const roomData = snapshot.val();

                if (role === 'host') {
                    if (roomData) {
                        if (roomData.password === password) {
                            appLog('Auth', 'Host joined existing room successfully.');
                            enterRoom(roomId, role);
                        } else {
                            showToast("Incorrect password for existing room.", "error");
                            appLog('Auth', 'Host failed: Incorrect password.');
                        }
                    } else {
                        appLog('Auth', 'Creating new room...');
                        await ref.set({
                            password: password,
                            url: '',
                            isPlaying: false,
                            time: 0,
                            lastUpdated: firebase.database.ServerValue.TIMESTAMP
                        });
                        enterRoom(roomId, role);
                    }
                } else if (role === 'member') {
                    if (roomData) {
                        if (roomData.password === password) {
                            appLog('Auth', 'Member joined successfully.');
                            enterRoom(roomId, role);
                        } else {
                            showToast("Incorrect password.", "error");
                            appLog('Auth', 'Member failed: Incorrect password.');
                        }
                    } else {
                        showToast("Room does not exist. Ask host to create it.", "error");
                        appLog('Auth', 'Member failed: Room not found.');
                    }
                }
            } catch (err) {
                appLog('Auth', 'Firebase Error', err);
                showToast("Database error. Check network connection.", "error");
            }
            
            setJoinLoading(false);
        });

        function enterRoom(roomId, role) {
            currentRoomId = roomId;
            currentRole = role;
            roomRef = db.ref(`rooms/${roomId}`);

            // Transition UI
            views.login.classList.add('hidden');
            views.room.classList.remove('hidden');
            display.roomId.textContent = roomId;
            display.role.textContent = role;

            if (role === 'host') {
                display.hostControls.classList.remove('hidden');
                player.idleText.textContent = "Waiting for you to set a video source...";
            } else {
                display.hostControls.classList.add('hidden');
                player.idleText.textContent = "Awaiting Host to load media...";
            }

            appLog('Room', `Entered room ${roomId}`);
            setupFirebaseListeners();
        }

        btns.leave.addEventListener('click', () => {
            appLog('Room', 'Leaving room...');
            if (roomRef) roomRef.off();
            
            player.video.pause();
            player.video.src = "";
            player.video.removeAttribute('src'); // Clean up DOM
            
            // Revoke memory if we downloaded a blob
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
            
            currentRoomId = null;
            currentRole = null;
            roomRef = null;
            currentVideoSource = null;
            
            views.room.classList.add('hidden');
            views.login.classList.remove('hidden');
            player.noVideoOver.classList.remove('hidden');
            inputs.roomId.value = '';
            inputs.roomPass.value = '';
        });

        // --- STREAMING_CHUNK:URL Processing & Download Engine ---

        function processDriveUrl(url) {
            // Converts Google Drive view links to direct download/stream links
            if (url.includes('drive.google.com/file/d/')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    const newUrl = `https://drive.google.com/uc?export=download&id=${match[1]}`;
                    appLog('URL', `Converted Drive URL to direct link: ${newUrl}`);
                    return newUrl;
                }
            }
            return url;
        }

        async function loadVideoWithFallback(url) {
            // Prevent redundant processing if it's the same URL
            if (currentVideoSource === url) return;
            
            currentVideoSource = url;
            player.noVideoOver.classList.add('hidden');
            
            // Clean up previous blob if exists
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }

            const processedUrl = processDriveUrl(url);
            
            // Reset UI
            player.dlOver.classList.remove('hidden');
            player.dlBar.style.width = '0%';
            player.dlText.textContent = '0% (Connecting...)';
            appLog('Download', `Attempting to fetch and download: ${processedUrl}`);

            try {
                // Attempt Fetch API for download progress
                const response = await fetch(processedUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const contentLength = response.headers.get('content-length');
                appLog('Download', `Content-Length: ${contentLength ? (contentLength/1024/1024).toFixed(2) + ' MB' : 'Unknown'}`);

                if (!contentLength) {
                    // Indeterminate progress
                    player.dlText.textContent = 'Downloading... (Size unknown)';
                    player.dlBar.style.width = '100%';
                    player.dlBar.classList.add('animate-pulse');
                }

                const reader = response.body.getReader();
                const total = parseInt(contentLength, 10);
                let loaded = 0;
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    chunks.push(value);
                    loaded += value.length;

                    if (total) {
                        const progress = (loaded / total) * 100;
                        player.dlBar.style.width = `${progress}%`;
                        player.dlText.textContent = `${progress.toFixed(1)}%`;
                    }
                }

                appLog('Download', 'Download complete. Assembling Blob...');
                player.dlText.textContent = 'Processing file...';
                
                const blob = new Blob(chunks);
                currentObjectUrl = URL.createObjectURL(blob);
                
                player.dlOver.classList.add('hidden');
                player.dlBar.classList.remove('animate-pulse');
                
                // Assign Blob URL to Video
                player.video.src = currentObjectUrl;
                appLog('Download', 'Blob URL assigned to video player.');
                showToast("Media loaded successfully.", "success");

            } catch (error) {
                appLog('Download', 'Fetch failed (likely CORS or Network issue). Executing Fallback.', error);
                
                // FALLBACK: Directly set the src. The browser handles CORS internally for <video> tags much better.
                showToast("Download restricted. Falling back to direct stream...", "info");
                
                player.dlOver.classList.add('hidden');
                player.dlBar.classList.remove('animate-pulse');
                
                player.video.src = processedUrl;
                appLog('Fallback', 'Set video.src directly to bypass JS fetch restrictions.');
            }
        }

        // Host setting the video
        btns.setVideo.addEventListener('click', () => {
            if (currentRole !== 'host') return;
            
            const rawUrl = inputs.videoUrl.value.trim();
            if (rawUrl) {
                appLog('Sync', 'Host pushing new video URL to Firebase.');
                roomRef.update({
                    url: rawUrl,
                    isPlaying: false,
                    time: 0,
                    lastUpdated: firebase.database.ServerValue.TIMESTAMP
                });
                inputs.videoUrl.value = '';
                showToast("Broadcast link sent to room.", "success");
            }
        });

        // --- STREAMING_CHUNK:Firebase Sync Engine (The Brains) ---

        function setupFirebaseListeners() {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. URL Sync & Download trigger
                if (data.url) {
                    loadVideoWithFallback(data.url);
                } else {
                    player.noVideoOver.classList.remove('hidden');
                    player.video.src = "";
                }

                if (!data.url || !currentVideoSource) return; // Wait until media is configured

                // 2. Time Sync (Seek)
                // If diff is > 1.5 seconds, force a seek to sync up.
                const timeDiff = Math.abs(player.video.currentTime - data.time);
                if (timeDiff > 1.5) {
                    appLog('Sync', `Remote seek detected. Local: ${player.video.currentTime}, Remote: ${data.time}`);
                    isRemoteUpdatingSeek = true; 
                    player.video.currentTime = data.time;
                }

                // 3. Playback State Sync
                if (data.isPlaying && player.video.paused) {
                    appLog('Sync', 'Remote play detected. Playing local video.');
                    isRemoteUpdatingPlay = true;
                    player.video.play().catch(e => {
                        appLog('Sync Error', "Autoplay prevented. User interaction needed.", e);
                        showToast("Click play to synchronize.", "info");
                        isRemoteUpdatingPlay = false; 
                    });
                } else if (!data.isPlaying && !player.video.paused) {
                    appLog('Sync', 'Remote pause detected. Pausing local video.');
                    isRemoteUpdatingPause = true;
                    player.video.pause();
                }
            });
        }

        // Helper to update Firebase state
        function pushRoomState(updates) {
            if (!roomRef) return;
            updates.lastUpdated = firebase.database.ServerValue.TIMESTAMP;
            roomRef.update(updates);
        }

        // DOM Event: PLAY
        player.video.addEventListener('play', () => {
            if (isRemoteUpdatingPlay) {
                appLog('Event', 'Play ignored (Remote origin)');
                isRemoteUpdatingPlay = false;
                return;
            }
            appLog('Event', 'Play captured (Local origin). Pushing to Firebase.');
            pushRoomState({
                isPlaying: true,
                time: player.video.currentTime
            });
        });

        // DOM Event: PAUSE
        player.video.addEventListener('pause', () => {
            if (isRemoteUpdatingPause) {
                appLog('Event', 'Pause ignored (Remote origin)');
                isRemoteUpdatingPause = false;
                return;
            }
            appLog('Event', 'Pause captured (Local origin). Pushing to Firebase.');
            pushRoomState({
                isPlaying: false,
                time: player.video.currentTime
            });
        });

        // DOM Event: SEEKED (Fires when user finishes scrubbing)
        player.video.addEventListener('seeked', () => {
            if (isRemoteUpdatingSeek) {
                appLog('Event', 'Seek ignored (Remote origin)');
                isRemoteUpdatingSeek = false;
                return;
            }
            appLog('Event', `Seek captured (Local origin) to ${player.video.currentTime}. Pushing to Firebase.`);
            pushRoomState({
                time: player.video.currentTime
            });
        });

        // Graceful disconnect on tab close
        window.addEventListener('beforeunload', () => {
            if (roomRef) {
                roomRef.off();
            }
        });

        appLog('Init', 'Application ready.');
    </script>
</body>
